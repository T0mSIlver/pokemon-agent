[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-agent"
version = "0.1.0"
description = "Vision-first Pokemon gameplay agent: headless emulation, REST API, Pi supervisor, and live operator dashboard."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Tom Vaucourt"},
]
maintainers = [
    {name = "Tom Vaucourt"},
]
keywords = ["pokemon", "ai", "agent", "emulator", "gameboy", "gba", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "Pillow>=10.0.0",
    # fastapi 0.141 (the version this project resolves) requires pydantic>=2.9.
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
pyboy = ["pyboy>=2.0.0"]
pygba = ["pygba>=0.1.0"]
dashboard = ["aiofiles>=23.0.0"]
dev = [
    # pytest-asyncio 1.x requires pytest>=8.4; pytest 9 rejects pytest-asyncio 0.x.
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
]
all = [
    "pokemon-agent[pyboy,dashboard]",
]

[project.urls]
Homepage = "https://github.com/T0mSIlver/pokemon-agent"
Repository = "https://github.com/T0mSIlver/pokemon-agent"
Issues = "https://github.com/T0mSIlver/pokemon-agent/issues"
Upstream = "https://github.com/NousResearch/pokemon-agent"

[project.scripts]
pokemon-agent = "pokemon_agent.cli:main"
poke = "pokemon_agent.agent_cli:main"

[tool.setuptools.packages.find]
include = ["pokemon_agent*"]

[tool.setuptools.package-data]
"pokemon_agent.dashboard" = ["static/**/*"]
"pokemon_agent" = ["data/*.json", "data/game/*.json", "data/guides/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Throwaway reproduction scripts written by delegated review agents. Kept on
# disk while a finding is open, never shipped, never linted.
extend-exclude = [".agent-runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
