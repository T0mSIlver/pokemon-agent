name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project
        run: uv venv --python ${{ matrix.python-version }} && uv pip install -e ".[pyboy,dashboard,dev]"

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Test
        # The suite is emulator-free; scripts/manual/ needs a ROM and is excluded
        # from collection via `testpaths` in pyproject.toml.
        run: uv run pytest -q
